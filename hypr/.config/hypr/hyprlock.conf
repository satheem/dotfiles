# =========================
# Hyprlock - Clear start, blur while typing
# =========================

# Global background (no blur)
background {
    monitor =
    path = ~/Rainnight.jpg
    blur = false
}

# Input field (blur activates only on this monitor while typing)
input-field {
    monitor = eDP-1
    size = 250, 55
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true

    outer_color = rgba(0,0,0,0.35)
    inner_color = rgba(0,0,0,0.2)
    font_color = rgb(255,255,255)

    fade_on_empty = true
    fade_timeout = 800

    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1

    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300

    # THIS enables blur only while typing on eDP-1
    blur = true
    blur_size = 10
    blur_passes = 3
    brightness = 1.0
}

# Clock label
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 1.0)
    font_size = 50
    font_family = Fira Semibold
    position = -100, 40
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Username label
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 22
    font_family = Fira Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

