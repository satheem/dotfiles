# ------------------------------
# WINDOW COLORS (Catppuccin style)
# target                 title     bg       text     indicator  border
# ------------------------------

# Focused window colors
client.focused           #b4befe   #1e1e2e  #cdd6f4  #b4befe    #b4befe

# When window is visible but not active
client.focused_inactive  #6c7086   #1e1e2e  #cdd6f4  #6c7086    #6c7086

# Unfocused window colors
client.unfocused         #6c7086   #1e1e2e  #cdd6f4  #6c7086    #6c7086

# Urgent window (e.g., message apps) highlight
client.urgent            #fab387   #1e1e2e  #fab387  #fab387    #fab387

# Placeholder windows (used by i3 in certain conditions)
client.placeholder       #6c7086   #1e1e2e  #cdd6f4  #6c7086    #6c7086

# Background behind windows
client.background        #1e1e2e


# ------------------------------
# WINDOW GAPS
# ------------------------------

# Inner gaps → space between windows
gaps inner 4

# Outer gaps → space between windows and screen edge
gaps outer 4


# ------------------------------
# BORDER SETTINGS (remove title bar)
# ------------------------------

# Default border width for all windows
default_border pixel 2

# Preserve border for dialogs (floating)
for_window [window_type="dialog"] border pixel 2

# Utility windows (small pop-ups)
for_window [window_type="utility"] border pixel 2

# Toolbar-like windows
for_window [window_type="toolbar"] border pixel 2

# VSCode special class fix (prevents weird border behavior)
for_window [class="Code"] border pixel 2


# ------------------------------
# FONT SETTINGS
# ------------------------------

# Use Meslo Nerd Font (recommended for icons + polybar)
font pango:MesloLGM Nerd Font 14
