# Open Application
bindsym $mod+c exec --no-startup-id code  # code
bindsym $mod+b exec --no-startup-id brave # brave
bindsym $mod+e exec --no-startup-id dolphin # file manager
bindsym $mod+a exec --no-startup-id rofi -show drun -show-icons # rofi
bindsym $mod+p exec --no-startup-id ~/.config/i3/scripts/color-picker.sh # color-picker
bindsym $mod+Escape exec --no-startup-id rofi -modi "powermenu:$HOME/.config/i3/scripts/power-menu" -show powermenu #power-menu 
bindsym $mod+v exec --no-startup-id copyq toggle # clipboard
bindsym $mod+Return exec kitty # kitty
bindsym $mod+l exec --no-startup-id betterlockscreen -l dimblur --span



# Function Button 
bindsym XF86AudioRaiseVolume exec --no-startup-id ~/.config/i3/scripts/volume.sh up # Increase volume
bindsym XF86AudioLowerVolume exec --no-startup-id ~/.config/i3/scripts/volume.sh down # Decrease volume
bindsym XF86AudioMute exec --no-startup-id ~/.config/i3/scripts/volume.sh mute # Toggle mute
bindsym XF86MonBrightnessUp exec --no-startup-id ~/.config/i3/scripts/brightness.sh up # Brightness up
bindsym XF86MonBrightnessDown exec --no-startup-id ~/.config/i3/scripts/brightness.sh down # Brightness down
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause # Play / Pause
bindsym XF86AudioNext exec --no-startup-id playerctl next # Next track
bindsym XF86AudioPrev exec --no-startup-id playerctl previous # Previous track


# Screenshot
bindsym Print exec flameshot gui # Screenshots-Selector
bindsym Shift+Print exec flameshot full -c -p ~/Pictures/Screenshots # Screenshots-Full
bindsym $mod+Print exec flameshot gui --region 1920x1080+0+0 -c -p ~/Pictures/Screenshots # Screenshots-Laptop-screen
bindsym $mod+Shift+Print exec flameshot gui --region 1920x1080+1920+0 -c -p ~/Pictures/Screenshots # Screenshots-Monitor-screen


# Use Mouse+$mod to drag floating windows to their wanted position
floating_modifier $mod


# kill focused window
bindsym $mod+q kill


# change focus
bindsym Mod1+j focus left
bindsym Mod1+k focus down
bindsym Mod1+l focus up
bindsym Mod1+semicolon focus right



# alternatively, you can use the cursor keys:
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right



# move focused window
bindsym $mod+Ctrl+j move left
bindsym $mod+Ctrl+k move down
bindsym $mod+Ctrl+l move up
bindsym $mod+Ctrl+semicolon move right



# alternatively, you can use the cursor keys:
bindsym $mod+Ctrl+Left move left
bindsym $mod+Ctrl+Down move down
bindsym $mod+Ctrl+Up move up
bindsym $mod+Ctrl+Right move right



# Resize windows
bindsym $mod+Shift+Left  resize shrink width 50 px
bindsym $mod+Shift+Right resize grow   width 50 px
bindsym $mod+Shift+Up    resize shrink height 50 px
bindsym $mod+Shift+Down  resize grow   height 50 px



# split in horizontal orientation
bindsym Mod1+h split h
# split in vertical orientation
bindsym Mod1+v split v



# enter fullscreen mode for the focused container
bindsym $mod+f fullscreen toggle



# change container layout (stacked, tabbed, toggle split)
bindsym Mod1+s layout stacking
bindsym Mod1+w layout tabbed
bindsym Mod1+e layout toggle split


# toggle tiling / floating
bindsym $mod+Shift+space floating toggle
# change focus between tiling / floating windows
bindsym $mod+space focus mode_toggle



# We use variables to avoid repeating the names in multiple places.
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"



# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10



# Move window to workspace and switch focus to that workspace
bindsym $mod+Shift+1 move container to workspace 1; workspace 1
bindsym $mod+Shift+2 move container to workspace 2; workspace 2
bindsym $mod+Shift+3 move container to workspace 3; workspace 3
bindsym $mod+Shift+4 move container to workspace 4; workspace 4
bindsym $mod+Shift+5 move container to workspace 5; workspace 5
bindsym $mod+Shift+6 move container to workspace 6; workspace 6
bindsym $mod+Shift+7 move container to workspace 7; workspace 7
bindsym $mod+Shift+8 move container to workspace 8; workspace 8
bindsym $mod+Shift+9 move container to workspace 9; workspace 9
bindsym $mod+Shift+0 move container to workspace 10; workspace 10



# reload the configuration file
bindsym $mod+Shift+c reload
# restart i3 inplace (preserves your layout/session, can be used to upgrade i3)
bindsym $mod+Shift+r restart


